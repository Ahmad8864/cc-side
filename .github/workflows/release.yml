name: Release

# Changes to the helpers, and manual runs, build and verify without publishing.
on:
  push:
    tags: ['cc-side--v*']
    branches: [main]
    paths:
      - bridge/**
      - shared/**
      - scripts/build.ts
      - package.json
      - bun.lock
      - tests/lifecycle.test.ts
      - .github/workflows/release.yml
  pull_request:
    paths:
      - bridge/**
      - shared/**
      - scripts/build.ts
      - package.json
      - bun.lock
      - tests/lifecycle.test.ts
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/cc-side-*.zip
            dist/marketplace.json
            dist/SHA256SUMS

  # Each helper runs from the release archive on the system it was built for.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, helper: cc-side-darwin-arm64 }
          - { runner: macos-15-intel, helper: cc-side-darwin-x64 }
          - { runner: ubuntu-latest, helper: cc-side-linux-x64 }
          - { runner: ubuntu-24.04-arm, helper: cc-side-linux-arm64 }
          - { runner: windows-latest, helper: cc-side-windows-x64.exe }
          - { runner: windows-11-arm, helper: cc-side-windows-arm64.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CC_SIDE_HELPER: ${{ github.workspace }}/plugin/helpers/${{ matrix.helper }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - run: unzip -q dist/cc-side-*.zip -d plugin
      - run: '"$CC_SIDE_HELPER" --version'
      - run: bun test tests/lifecycle.test.ts

  publish:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/cc-side-*.zip dist/marketplace.json dist/SHA256SUMS
          --verify-tag --title "cc-side ${GITHUB_REF_NAME#cc-side--v}"
          --generate-notes
      - name: Update marketplace
        run: |
          git fetch origin main
          git checkout main
          cp dist/marketplace.json .claude-plugin/marketplace.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/marketplace.json
          git diff --cached --quiet || git commit -m "Update marketplace for $GITHUB_REF_NAME"
          git push origin main
