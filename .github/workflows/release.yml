name: Release

on:
  push:
    tags: ['cc-side--v*']
  # A manual run builds and checks the release without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Check the built helper on Node and Bun
        run: bun test tests/lifecycle.test.ts
        env:
          CC_SIDE_HELPER: ${{ github.workspace }}/dist/plugin/helper.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/cc-side-*.zip
            dist/marketplace.json
            dist/SHA256SUMS

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/cc-side-*.zip dist/marketplace.json dist/SHA256SUMS
          --verify-tag --title "cc-side ${GITHUB_REF_NAME#cc-side--v}"
          --generate-notes
      - name: Update marketplace
        run: |
          git fetch origin main
          git checkout main
          cp dist/marketplace.json .claude-plugin/marketplace.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/marketplace.json
          git diff --cached --quiet || git commit -m "Update marketplace for $GITHUB_REF_NAME"
          git push origin main
