name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The oldest Node.js the helper supports, for the lifecycle test's Node run.
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: bun install --frozen-lockfile
      - run: bun run check
